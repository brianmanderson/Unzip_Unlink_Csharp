name: Build and Release

on:
  push:
    tags:
      - 'v*'   # e.g. v2.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Unzip_Unlink_CSharp.sln --configuration Release

      # Self-contained: nothing to install on the target PC.
      - name: Publish desktop app
        run: >
          dotnet publish UnzipUnlinkGUI/UnzipUnlinkGUI.csproj --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/UnzipUnlink-Desktop

      - name: Publish web app
        run: >
          dotnet publish UnzipUnlink.Web/UnzipUnlink.Web.csproj --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true
          --output publish/UnzipUnlink-Web

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/UnzipUnlink-Desktop/* -DestinationPath UnzipUnlink-Desktop-win-x64.zip
          Compress-Archive -Path publish/UnzipUnlink-Web/* -DestinationPath UnzipUnlink-Web-win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unzip-unlink
          path: |
            UnzipUnlink-Desktop-win-x64.zip
            UnzipUnlink-Web-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UnzipUnlink-Desktop-win-x64.zip
            UnzipUnlink-Web-win-x64.zip
